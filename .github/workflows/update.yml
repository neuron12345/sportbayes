name: Aktualizace SportBayes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sportbayes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Vypocet a stranka
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python sportbayes.py build
      - name: Ulozit vysledek
        if: always()
        run: |
          git config user.name "sportbayes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && exit 0
          git commit -m "aktualizace"
          git pull --rebase
          git push 
